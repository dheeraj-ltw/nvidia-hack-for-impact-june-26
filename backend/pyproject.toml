[project]
name = "patrol-assist-api"
version = "0.1.0"
description = "FastAPI backend for the Patrol Assist decision-support system"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
    "websockets>=13",
    "python-multipart>=0.0.12",
    "aioboto3>=13.2",
    # Speaker identification: local voice embeddings (resemblyzer pulls in torch),
    # plus numpy for the cosine match. Audio is decoded via the ffmpeg already in the image.
    "resemblyzer>=0.1.3",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.7",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "C4", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

# resemblyzer and its transitive deps ship no type stubs.
[[tool.mypy.overrides]]
module = ["resemblyzer.*", "numpy.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
