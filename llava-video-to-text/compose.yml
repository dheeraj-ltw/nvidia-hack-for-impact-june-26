services:
  llava-video-to-text:
    build:
      context: .
      dockerfile: Dockerfile
    image: llava-video-to-text:latest
    container_name: llava-video-to-text
    runtime: nvidia
    shm_size: 16gb
    ports:
      - "${LLAVA_PORT:-8900}:8900"
    env_file:
      - path: .env
        required: false
    environment:
      # Forward the HF token under both names vLLM / huggingface_hub may read.
      HF_TOKEN: "${HF_TOKEN:-}"
      HUGGING_FACE_HUB_TOKEN: "${HF_TOKEN:-}"
    volumes:
      # Persist the downloaded model across restarts.
      - llava-hf-cache:/root/.cache/huggingface
    ulimits:
      memlock: -1
      stack: 67108864
    deploy:
      resources:
        reservations:
          devices:
            - capabilities:
                - gpu
              driver: nvidia
              device_ids:
                - "${VLM_DEVICE_ID:-0}"
    restart: unless-stopped
    healthcheck:
      # /health returns 200 only once the in-container vLLM is ready (model loaded).
      test: ["CMD-SHELL", "curl -fs http://localhost:8900/health || exit 1"]
      interval: 60s
      timeout: 30s
      retries: 3
      start_period: 1200s

volumes:
  llava-hf-cache:
