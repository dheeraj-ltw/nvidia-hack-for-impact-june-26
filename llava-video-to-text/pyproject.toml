# Dev-only project file for running the orchestrator locally with uv (the container build uses
# pip on top of the vLLM base image, not this file).

[project]
name = "llava-video-to-text"
version = "0.1.0"
description = "Standalone LLaVA video-to-text container (vLLM + FastAPI) for NVIDIA DGX Spark"
requires-python = ">=3.10"
dependencies = [
    "fastapi~=0.115",
    "uvicorn[standard]~=0.34",
    "httpx~=0.27",
    "opencv-python-headless~=4.10",
    "pydantic-settings~=2.5",
    "sse-starlette~=2.1",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "B", "C4", "UP", "SIM", "Q", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.isort]
force-single-line = true

[tool.ruff.format]
quote-style = "double"
