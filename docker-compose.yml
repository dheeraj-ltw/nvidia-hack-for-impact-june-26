services:
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./backend
    env_file: .env
    environment:
      S3_ENDPOINT: http://minio:9000
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      minio:
        condition: service_healthy
    volumes:
      - ./backend:/app
      # Drop a corporate/proxy root CA (PEM) into ./certs to have it trusted at startup
      # (e.g. behind Zscaler TLS interception). Empty by default — nothing to trust.
      - ./certs:/usr/local/share/ca-certificates/extra:ro
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # Fine-tuned PoliceAI reasoner (OpenAI-compatible). Optional: needs a GGUF model file
  # mounted at MODEL_PATH. Start it explicitly with `--profile reasoner` once a model is in
  # ./models, then set AI_BACKEND=live and POLICEAI_BASE_URL=http://police-llm:8000/v1.
  police-llm:
    build: ./police-llm
    profiles: ["reasoner"]
    environment:
      MODEL_PATH: /models/model.gguf
      MODEL_NAME: ${POLICEAI_MODEL:-policeai}
      # CPU-only by default so it runs anywhere; set N_GPU_LAYERS=-1 to offload to a GPU.
      N_GPU_LAYERS: ${POLICEAI_N_GPU_LAYERS:-0}
    volumes:
      - ./models:/models:ro
    ports:
      - "${POLICEAI_PORT:-8001}:8000"

  web:
    build: ./frontend
    env_file: .env
    environment:
      NEXT_PUBLIC_API_BASE: http://localhost:${API_PORT:-8000}
      NEXT_PUBLIC_WS_BASE: ws://localhost:${API_PORT:-8000}
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      - api
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    command: npm run dev

volumes:
  minio_data:
